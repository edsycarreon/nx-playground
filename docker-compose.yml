# docker-compose.yml
version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgresql
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh

volumes:
  postgres_data:
